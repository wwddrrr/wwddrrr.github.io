short_bio: >-
  <p>
    Since August 2026, I have been a Ph.D. student in the Department of Mathematics at the National University of Singapore,
    advised by Prof. <a href="https://vyftan.github.io/" target="_blank">Vincent Tan</a>
    and co-advised by Prof. <a href="https://blog.nus.edu.sg/zhenhua/" target="_blank">Zhenhua Lin</a>.
    Before joining NUS, I received my bachelor's degree in Statistics from the School of the Gifted Young,
    University of Science and Technology of China, under the guidance of Prof.
    <a href="https://bs.ustc.edu.cn/english/profile.php?id=650" target="_blank">Xueqin Wang</a>.
  </p>
  <p>
    My research interests include conformal prediction, non-Euclidean statistics, and statistical machine learning.
    If you are interested in my research, I would be happy to hear from you.
  </p>

